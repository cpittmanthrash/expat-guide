                        );
                      })}

                      {selectedDest.sources && selectedDest.sources.length > 0 && (
                        <div style={{ borderTop: "2px solid #1e3a5f20", paddingTop: 16, marginTop: 4 }}>
                          <strong style={{ fontSize: 13, color: "#1e3a5f", display: "block", marginBottom: 10 }}>🔗 Sources &amp; Official Links</strong>
                          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                            {selectedDest.sources.map((s, i) => (
                              <a key={i} href={s.url} target="_blank" rel="noopener noreferrer"
                                style={{ fontSize: 12, color: "#2d5986", display: "flex", alignItems: "center", gap: 6, padding: "6px 10px", background: "#f0f6ff", borderRadius: 6, border: "1px solid #bfdbfe", textDecoration: "none" }}
                                onMouseEnter={e => e.currentTarget.style.background = "#dbeafe"}
                                onMouseLeave={e => e.currentTarget.style.background = "#f0f6ff"}>
                                <span>↗</span> {s.label}
                              </a>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>

          <div style={{ textAlign: "center", padding: "2rem 1rem", fontSize: 11, color: "#999", borderTop: "1px solid #e8eef4", marginTop: 32 }}>
            Based on research through March 2026 • Visa rules and costs change frequently — always verify with official consulate and government sources before making decisions • Not legal or immigration advice
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
